<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="buildingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <rect width="400" height="300" fill="url(#bg)"/>
  
  <!-- Decorative shapes -->
  <circle cx="330" cy="60" r="50" fill="#3b82f6" opacity="0.08"/>
  <circle cx="70" cy="260" r="60" fill="#ec4899" opacity="0.08"/>
  
  <!-- Modern Office Building -->
  <g filter="url(#shadow)">
    <!-- Main building -->
    <rect x="70" y="80" width="160" height="140" fill="url(#buildingGrad)" rx="8" stroke="#1e3a8a" stroke-width="2"/>
    
    <!-- Roof accent -->
    <polygon points="70,80 150,40 230,80" fill="#1e40af"/>
    
    <!-- Windows grid -->
    <g fill="#dbeafe" opacity="0.9">
      <rect x="85" y="95" width="22" height="22" rx="2"/>
      <rect x="115" y="95" width="22" height="22" rx="2"/>
      <rect x="145" y="95" width="22" height="22" rx="2"/>
      <rect x="175" y="95" width="22" height="22" rx="2"/>
      
      <rect x="85" y="135" width="22" height="22" rx="2"/>
      <rect x="115" y="135" width="22" height="22" rx="2"/>
      <rect x="145" y="135" width="22" height="22" rx="2"/>
      <rect x="175" y="135" width="22" height="22" rx="2"/>
      
      <rect x="85" y="175" width="22" height="22" rx="2"/>
      <rect x="115" y="175" width="22" height="22" rx="2"/>
      <rect x="145" y="175" width="22" height="22" rx="2"/>
      <rect x="175" y="175" width="22" height="22" rx="2"/>
    </g>
    
    <!-- Door -->
    <rect x="135" y="205" width="30" height="50" fill="#1e40af" rx="2" stroke="#1e3a8a" stroke-width="1.5"/>
    <circle cx="162" cy="230" r="2.5" fill="#fbbf24"/>
  </g>
  
  <!-- Accent circle with emoji -->
  <circle cx="340" cy="260" r="32" fill="#3b82f6" opacity="0.1"/>
  <text x="340" y="268" text-anchor="middle" font-size="28">🏢</text>
</svg>

