<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="vanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ef4444;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#dc2626;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <rect width="400" height="300" fill="url(#bg)"/>
  
  <!-- Decorative shapes -->
  <circle cx="330" cy="60" r="50" fill="#ef4444" opacity="0.08"/>
  <circle cx="70" cy="260" r="60" fill="#ec4899" opacity="0.08"/>
  
  <!-- Speed lines (motion effect) -->
  <line x1="30" y1="130" x2="50" y2="130" stroke="#ef4444" stroke-width="2" opacity="0.3"/>
  <line x1="20" y1="150" x2="45" y2="150" stroke="#ef4444" stroke-width="1.5" opacity="0.2"/>
  <line x1="35" y1="110" x2="55" y2="110" stroke="#ef4444" stroke-width="1.5" opacity="0.2"/>
  
  <!-- Modern Delivery Van -->
  <g filter="url(#shadow)">
    <!-- Van body -->
    <rect x="70" y="100" width="200" height="100" fill="url(#vanGrad)" rx="10" stroke="#991b1b" stroke-width="2"/>
    
    <!-- Van cabin -->
    <rect x="250" y="85" width="60" height="75" fill="#dc2626" rx="8"/>
    <polygon points="310,85 330,65 330,85" fill="#dc2626"/>
    
    <!-- Windows -->
    <rect x="85" y="120" width="50" height="50" fill="#fecaca" rx="4" opacity="0.85"/>
    <rect x="150" y="120" width="50" height="50" fill="#fecaca" rx="4" opacity="0.85"/>
    <rect x="265" y="105" width="40" height="40" fill="#fecaca" rx="3" opacity="0.85"/>
    
    <!-- Door handle -->
    <circle cx="210" cy="170" r="5" fill="#fbbf24"/>
    
    <!-- Wheels -->
    <circle cx="105" cy="205" r="25" fill="#1f2937" stroke="#ef4444" stroke-width="2"/>
    <circle cx="105" cy="205" r="16" fill="#374151" stroke="#ef4444" stroke-width="1.5" opacity="0.6"/>
    <circle cx="105" cy="205" r="8" fill="#ef4444" opacity="0.4"/>
    
    <circle cx="245" cy="205" r="25" fill="#1f2937" stroke="#ef4444" stroke-width="2"/>
    <circle cx="245" cy="205" r="16" fill="#374151" stroke="#ef4444" stroke-width="1.5" opacity="0.6"/>
    <circle cx="245" cy="205" r="8" fill="#ef4444" opacity="0.4"/>
  </g>
  
  <!-- Accent circle with emoji -->
  <circle cx="340" cy="260" r="32" fill="#ef4444" opacity="0.1"/>
  <text x="340" y="268" text-anchor="middle" font-size="28">🚚</text>
</svg>
    
