<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="sofaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <rect width="400" height="300" fill="url(#bg)"/>
  
  <!-- Decorative shapes -->
  <circle cx="330" cy="60" r="50" fill="#8b5cf6" opacity="0.08"/>
  <circle cx="70" cy="260" r="60" fill="#ec4899" opacity="0.08"/>
  
  <!-- Modern Sofa/Couch -->
  <g filter="url(#shadow)">
    <!-- Main body -->
    <rect x="60" y="140" width="280" height="120" fill="url(#sofaGrad)" rx="12" stroke="#6d28d9" stroke-width="2"/>
    
    <!-- Cushions -->
    <ellipse cx="100" cy="155" rx="35" ry="45" fill="#a78bfa"/>
    <ellipse cx="200" cy="140" rx="45" ry="55" fill="#a78bfa"/>
    <ellipse cx="300" cy="155" rx="35" ry="45" fill="#a78bfa"/>
    
    <!-- Back support -->
    <rect x="70" y="110" width="260" height="40" fill="#c4b5fd" rx="8"/>
    
    <!-- Legs -->
    <rect x="75" y="255" width="12" height="20" fill="#1f2937" rx="2"/>
    <rect x="320" y="255" width="12" height="20" fill="#1f2937" rx="2"/>
  </g>
  
  <!-- Accent circle with emoji -->
  <circle cx="340" cy="260" r="32" fill="#8b5cf6" opacity="0.1"/>
  <text x="340" y="268" text-anchor="middle" font-size="28">🛋️</text>
</svg>